[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clingwrap"
version = "0.0.0"
description = "A ROS2 launch wrapper to simplify writing python launch files"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "launch",
    "launch_ros",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clingwrap*"]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "MSGS",
    "SRVS",
    "ACTIONS",
    "FIRSTPARTY",
    "LOCALFOLDER",
    "TYPING",
]
default_section = "THIRDPARTY"
known_msgs = ["*.msg"]
known_srvs = ["*.srv"]
known_actions = ["*.action"]
known_typing = ["typing", "mypy_extensions", "typing_extensions"]
force_sort_within_sections = "true"
force_to_top = "true"
src_paths = ["clingwrap/**"]
